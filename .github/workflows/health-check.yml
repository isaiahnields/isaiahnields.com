name: Health Check
on:
  push:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  compare-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Compare PDF Content
        run: |
          cat << 'EOF' > compare.py
          import sys
          from pypdf import PdfReader

          def extract_text(pdf_path):
              try:
                  reader = PdfReader(pdf_path)
                  text = ""
                  for page in reader.pages:
                      text += page.extract_text() + "\n"
                  return text.strip()
              except Exception as e:
                  print(f"Error reading {pdf_path}: {e}")
                  sys.exit(1)

          # Target PDF URLs to compare
          download_path = "ResumeDownload.pdf"
          local_path = "Resume.pdf"

          text1 = extract_text(download_path)
          text2 = extract_text(local_path)

          if text1 == text2:
              print("Success: PDF contents are identical.")
              sys.exit(0)
          else:
              print("Error: PDF contents do not match!")
              # Optional: print or save a diff here
              sys.exit(1)
          EOF
          
          curl -sL "https://isaiahnields.com" -o ResumeDownload.pdf
          
          python compare.py
