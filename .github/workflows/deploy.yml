name: Deploy with Terraform

on:
  push:
    branches:
      - main # Automatically runs whenever you push changes to the main branch

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false # Disabled to allow output parsing

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      run: terraform apply -auto-approve

    # Instantly flushes the CloudFront cache edge locations so updates go live immediately
    - name: Invalidate CloudFront CDN Cache
      run: |
        DIST_ID=$(terraform output -raw cloudfront_distribution_id)
        aws cloudfront create-invalidation --distribution-id DIST_ID --paths "/*"


